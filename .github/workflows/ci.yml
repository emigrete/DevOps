# =============================================================
# CI — checks que se exigen en la rama protegida `main`.
# Primera vía (Flujo) del DevOps; el pipeline frena ante un fallo
# (Andon Cord): si lint/test/build fallan, el PR no se puede mergear.
# Ref: https://docs.github.com/en/actions/using-workflows/about-workflows
# =============================================================
name: CI

# Corre en cada push y en cada PR — feedback temprano sobre cada cambio.
on: [push, pull_request]

jobs:
  # ── Lint ─────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # misma versión que la imagen de producción
      # ruff: linter moderno y rápido (reemplaza flake8). Usa las reglas
      # por defecto: Pyflakes (F) + pycodestyle E4/E7/E9 (sin chequeo de
      # longitud de línea, para no frenar el pipeline por estilo).
      # Ref: https://docs.astral.sh/ruff/
      - run: pip install ruff
      - run: ruff check app tests

  # ── Tests unitarios ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip # cachea ~/.cache/pip entre runs → build más rápido
      - run: pip install -r requirements.txt
      # pytest con cobertura — los tests unitarios de Persona A.
      - run: pytest --cov=app

  # ── Security gate (DevSecOps) ────────────────────────────────
  # Cuarto check en la vía protegida: escaneo de seguridad en cada PR.
  # Andon Cord de seguridad — si aparece un CVE CRITICAL/HIGH, un secret
  # commiteado o una mala práctica en el Dockerfile, el pipeline frena y
  # el PR no se puede mergear. "Shift left": el hallazgo se ve antes del
  # deploy, no en producción.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: gitleaks escanea el rango de commits del PR
          # (base^..head) y con el shallow clone por defecto (fetch-depth: 1)
          # el commit base no existe localmente → git falla.
          # Ref: https://github.com/gitleaks/gitleaks-action#usage
          fetch-depth: 0

      # Trivy: escanea el filesystem del repo — CVEs en dependencias del
      # SO y del lenguaje. severity CRITICAL,HIGH + exit-code 1 → frena.
      # Ref: https://github.com/aquasecurity/trivy-action
      - name: Trivy — CVEs en deps
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true # solo falla por CVEs con fix disponible

      # pip-audit: CVEs específicos de las deps Python de requirements.txt
      # (requirements pineado → auditoría reproducible).
      # Ref: https://github.com/pypa/pip-audit
      - name: pip-audit — CVEs en deps Python
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      # hadolint: linter del Dockerfile — buenas prácticas de imagen.
      # Ref: https://github.com/hadolint/hadolint-action
      - name: hadolint — lint del Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

      # gitleaks: detecta secrets commiteados (API keys, tokens, passwords).
      # Ref: https://github.com/gitleaks/gitleaks-action
      - name: gitleaks — secrets commiteados
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build de la imagen ───────────────────────────────────────
  # Valida que el Dockerfile (Persona B) compila. SIN push: la
  # publicación a Docker Hub vive en publish.yml (solo en main).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tp-devops:ci
          # Cache de capas vía GitHub Actions cache → builds más rápidos.
          # Ref: https://docs.docker.com/build/ci/github-actions/cache/
          cache-from: type=gha
          cache-to: type=gha,mode=max
